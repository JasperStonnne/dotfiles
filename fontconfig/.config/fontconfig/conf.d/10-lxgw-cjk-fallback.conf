<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Smile-everywhere demo: Smile Nerd Font Mono is primary for all generic families.
       LXGW kept as further fallback in case Smile lacks a glyph. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Smile Nerd Font Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>LXGW WenKai Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Smile Nerd Font Mono</family>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Smile Nerd Font Mono</family>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>
</fontconfig>
