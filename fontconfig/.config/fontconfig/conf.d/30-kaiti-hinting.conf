<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- LXGW WenKai is a kaiti (handwritten) font. Its strokes are not designed
       for the pixel grid, so the system-default 'hintslight' autohinter often
       makes it look muddy at small UI sizes. Disabling autohinting lets
       antialiasing do its job and the strokes look closer to the design.
       Smile Nerd Font Mono inherits LXGW for its CJK glyphs, so we apply the
       same rule there. FiraCode (Smile's Latin part) has good embedded hints
       and tolerates this fine. -->

  <match target="font">
    <test name="family"><string>LXGW WenKai</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>

  <match target="font">
    <test name="family"><string>LXGW WenKai Mono</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>

  <match target="font">
    <test name="family"><string>Smile Nerd Font Mono</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
