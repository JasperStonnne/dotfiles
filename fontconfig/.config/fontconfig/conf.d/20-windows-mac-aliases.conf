<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Redirect Windows/macOS font names hardcoded in apps (QQ, WeChat, web
       pages, etc.) directly to Smile + LXGW. Two-level alias chains don't
       cascade in fontconfig, so we name the concrete fonts here. -->

  <!-- Proportional sans (Chinese UI fonts) -->
  <alias>
    <family>Microsoft YaHei</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>微软雅黑</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>SimHei</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>黑体</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>KaiTi</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>楷体</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>PingFang SC</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>PingFang TC</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>苹方</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>Hiragino Sans GB</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>Source Han Sans SC</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>思源黑体</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>

  <!-- Serif (Chinese article fonts) -->
  <alias>
    <family>SimSun</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>宋体</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>NSimSun</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>Source Han Serif SC</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>
  <alias>
    <family>思源宋体</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai</family></prefer>
  </alias>

  <!-- Monospace (Windows/macOS code fonts) -->
  <alias>
    <family>Consolas</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai Mono</family></prefer>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai Mono</family></prefer>
  </alias>
  <alias>
    <family>Menlo</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai Mono</family></prefer>
  </alias>
  <alias>
    <family>Monaco</family>
    <prefer><family>Smile Nerd Font Mono</family><family>LXGW WenKai Mono</family></prefer>
  </alias>
</fontconfig>
